<script>
(() => {
  const BOOK = "{{BOOK}}";
  const view = p => `/viewer#${BOOK}/${p}`;
  const input = document.getElementById("search-input");
  const list = document.getElementById("search-suggest");
  let items = [], active = -1, timer = 0, seq = 0;

  const fullText = q => { location.href = `/viewer#search?books.name=${BOOK}&pattern=${encodeURIComponent(q)}`; };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const highlight = (text, q) => {
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + "<b>" + esc(text.slice(i, i + q.length)) + "</b>" + esc(text.slice(i + q.length));
  };
  const close = () => { list.classList.remove("open"); input.setAttribute("aria-expanded", "false"); active = -1; };
  const render = q => {
    list.innerHTML = items.map((it, i) =>
      `<li role="option" id="opt-${i}" aria-selected="${i === active}" data-i="${i}">` +
      (it.kind === "pattern" ? `<span>Search for “${esc(q)}”</span><small>full text</small>`
                             : `<span>${highlight(it.value, q)}</span><small>article</small>`) + `</li>`).join("");
    list.classList.toggle("open", items.length > 0);
    input.setAttribute("aria-expanded", items.length > 0);
    input.setAttribute("aria-activedescendant", active >= 0 ? `opt-${active}` : "");
  };
  const choose = (i) => {
    const it = items[i], q = input.value.trim();
    if (!it || it.kind === "pattern") return q && fullText(q);
    location.href = view(it.path);
  };

  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { items = []; close(); return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const r = await fetch(`/suggest?content=${BOOK}&term=${encodeURIComponent(q)}&count=8`);
        const data = await r.json();
        if (mine !== seq) return;
        const arts = data.filter(d => d.kind === "path").slice(0, 7);
        items = [...arts, { kind: "pattern" }]; active = -1; render(q);
      } catch { /* suggestions are optional */ }
    }, 120);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!items.length) return;
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      render(input.value.trim());
    } else if (e.key === "Escape") { close(); }
  });
  document.getElementById("search-form").addEventListener("submit", e => {
    e.preventDefault();
    if (active >= 0) return choose(active);
    const q = input.value.trim();
    // an exact title match opens the article, anything else runs a full-text search
    const exact = items.find(it => it.kind === "path" && it.value.toLowerCase() === q.toLowerCase());
    exact ? (location.href = view(exact.path)) : q && fullText(q);
  });
  list.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); choose(+li.dataset.i); } });
  input.addEventListener("blur", () => setTimeout(close, 120));
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
  });

  document.getElementById("nav-random").addEventListener("click", async () => {
    try {
      const r = await fetch(`/random?content=${BOOK}`);
      const m = new URL(r.url).pathname.match(/^\/content\/[^/]+\/(.+)$/);
      location.href = m ? view(m[1]) : `/random?content=${BOOK}`;
    } catch { location.href = `/random?content=${BOOK}`; }
  });

  document.querySelectorAll(".tile").forEach((t, i) => { t.style.animationDelay = `${Math.min(i, 23) * 28}ms`; });
})();
</script>
