# Static receipt pages (actual-ai/scripts/receipt-pages.js output) behind the Authelia gate.
# Used by the receipts.ftoralesacosta.me proxy host's Advanced tab:  include /snippets/receipts.conf;
# Same gate as authelia.conf, but files are served from /receipts (read-only bind of
# ~/HomeLab/actual-ai/receipts) instead of being proxied. The host's forward target is never used.
# /files/ (read-write bind of .../receipts/files) also takes uploads: the page's "Attach receipt" button
# PUTs <transaction id>-<time>.<ext>, lists /files/ (autoindex JSON) and can DELETE its own files.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

set $target_url $scheme://$http_host$request_uri;
root /receipts;

location ^~ /files/ {
    auth_request /authelia_verify;
    error_page 401 =302 https://auth.ftoralesacosta.me/?rd=$target_url;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;

    # GET /files/ -> JSON list of attachments (the page filters by transaction id)
    autoindex on;
    autoindex_format json;
    limit_except GET HEAD { deny all; }

    # uploads/deletes only for "<uuid>[-suffix].<image|pdf>" directly in /files/
    location ~ "^/files/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-[A-Za-z0-9_]{1,40})?\.(jpe?g|png|webp|gif|heic|heif|pdf)$" {
        auth_request /authelia_verify;
        error_page 401 =302 https://auth.ftoralesacosta.me/?rd=$target_url;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
        dav_methods PUT DELETE;
        create_full_put_path off;
        dav_access user:rw group:rw all:r;
        client_max_body_size 25m;
        limit_except GET HEAD PUT DELETE { deny all; }
    }
}

location ~ ^/(?!\.well-known/acme-challenge).* {
    auth_request /authelia_verify;
    error_page 401 =302 https://auth.ftoralesacosta.me/?rd=$target_url;

    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
}

location = /authelia_verify {
    internal;
    set $authelia_verify_url http://authelia:9091/api/verify;
    proxy_pass $authelia_verify_url;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}
