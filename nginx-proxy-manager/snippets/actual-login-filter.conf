# Actual Budget (budget. host): only OpenID logins from the internet.
# Use in the host's Advanced tab:
#   include /snippets/actual-login-filter.conf;
#
# Actual keeps "password" in ACTUAL_ALLOWED_LOGIN_METHODS so the scripts in actual-ai
# (bank-sync, daily-fixups, actual-ai) can log in on the Docker network
# (http://actual-budget:5006 - they never pass through NPM). Without this filter, anyone
# on the internet could POST /account/login {"loginMethod":"password", ...} and skip Authelia.
#
# Rule for POST /account/login through NPM:
#   - the body must be JSON (Actual also accepts urlencoded - rejected here),
#   - it must decode (gzip/odd encodings fail closed),
#   - "loginMethod", if present, must be "openid" (absent = server's active method = openid).
location = /account/login {
    client_body_buffer_size 64k;
    client_max_body_size 64k;

    access_by_lua_block {
        if ngx.req.get_method() ~= "POST" then return end
        local function deny()
            ngx.status = 403
            ngx.header["Content-Type"] = "application/json"
            ngx.say('{"status":"error","reason":"only-openid-login-allowed-remotely"}')
            return ngx.exit(403)
        end
        local ctype = (ngx.var.content_type or ""):lower()
        if not ctype:match("^%s*application/json%s*;?") then return deny() end
        if ngx.var.http_content_encoding then return deny() end
        ngx.req.read_body()
        local body = ngx.req.get_body_data()
        if not body then return deny() end
        local cjson = require "cjson.safe"
        local data = cjson.decode(body)
        if type(data) ~= "table" then return deny() end
        local m = data.loginMethod
        if m ~= nil and m ~= "openid" then return deny() end
    }

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
}
