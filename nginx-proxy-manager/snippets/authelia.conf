# Authelia gate for an NPM proxy host. Use in the host's Advanced tab:
#   include /snippets/authelia.conf;
# Unauthenticated -> redirect to the Authelia login; who may pass is decided by
# access_control in authelia/configuration.yml.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

set $target_url $scheme://$http_host$request_uri;

location ~ ^/(?!\.well-known/acme-challenge).* {
    auth_request /authelia_verify;
    error_page 401 =302 https://auth.ftoralesacosta.me/?rd=$target_url;

    # websockets (Home Assistant, Jellyfin) - must be repeated here because this
    # location sets its own proxy headers via proxy.conf
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    include conf.d/include/proxy.conf;
}

location = /authelia_verify {
    internal;
    set $authelia_verify_url http://authelia:9091/api/verify;
    proxy_pass $authelia_verify_url;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}
