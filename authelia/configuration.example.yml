# Tracked template - copy to configuration.yml (gitignored) and fill in real secrets.
#   openssl rand -base64 32   # for the storage encryption_key

theme: auto

server:
  address: tcp://:9091/

identity_validation:
  reset_password:
    jwt_lifespan: 30m   # reset links stay valid 30 min (default 5 min)
    jwt_secret: "REPLACE_ME"

session:
  name: authelia
  expiration: 3600
  inactivity: 300
  same_site: lax
  # 4.38+ multi-domain format: one cookie for the apex covers all subdomains.
  cookies:
    - domain: ftoralesacosta.me
      authelia_url: https://auth.ftoralesacosta.me

storage:
  encryption_key: "REPLACE_ME_openssl_rand_base64_32"
  local:
    path: /config/data/database.sqlite3

authentication_backend:
  # 4.38: backend is selected by which block is present; no 'type' key.
  file:
    path: /config/auth_file.yml
    # log in / reset password with the username OR the email address
    search:
      email: true
      case_insensitive: true

notifier:
  smtp:
    address: submission://smtp.gmail.com:587  # submission = port 587 with STARTTLS
    username: you@example.com
    # password: supplied via AUTHELIA_NOTIFIER_SMTP_PASSWORD (from .env)
    sender: you@example.com

access_control:
  # Per-service allow/deny is handled by the NPM access list (Authelia method),
  # not here. This only governs the auth domain itself.
  default_policy: deny
  rules:
    - domain: "auth.ftoralesacosta.me"
      policy: one_factor

# OIDC provider (SSO for apps that support OpenID Connect, e.g. Open WebUI).
# Generate with the authelia image:
#   authelia crypto rand --length 64 --charset alphanumeric        # hmac_secret, client secret
#   authelia crypto hash generate pbkdf2 --variant sha512 --password '<client secret>'   # client_secret digest
#   authelia crypto pair rsa generate --bits 2048 --directory .     # private.pem for jwks
identity_providers:
  oidc:
    hmac_secret: 'REPLACE_ME_64_random_chars'
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: |
          -----BEGIN PRIVATE KEY-----
          REPLACE_ME
          -----END PRIVATE KEY-----
    # Put the user claims in the ID token too (4.39 serves them only via userinfo by default).
    claims_policies:
      default:
        id_token: ['email', 'email_verified', 'name', 'preferred_username', 'groups']
    clients:
      # Open WebUI: plaintext secret goes in /opt/open-webui/.env as OAUTH_CLIENT_SECRET.
      - client_id: 'open-webui'
        client_name: 'Open WebUI'
        client_secret: '$pbkdf2-sha512$REPLACE_WITH_DIGEST'
        public: false
        authorization_policy: 'one_factor'
        claims_policy: 'default'
        require_pkce: false
        redirect_uris:
          - 'https://webui.ftoralesacosta.me/oauth/oidc/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
