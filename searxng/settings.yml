use_default_settings: true

server:
  # secret_key is supplied via the SEARXNG_SECRET env var (see .env),
  # which overrides the config per the official image.
  # No rate limiting / bot protection: single-user instance on a private
  # network, queried only from the host.
  limiter: false
  public_instance: false

search:
  # JSON is required so the host agent can query programmatically.
  formats:
    - html
    - json

# More web engines, so research runs (Local Deep Research makes dozens of searches) spread their load
# instead of exhausting the few default ones. With use_default_settings, listing an engine here only
# overrides its "disabled" flag; everything else comes from SearXNG's defaults.
engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: yep
    disabled: false
