# Hermes gets its secrets from ~/HomeLab/.env via hermes-env.service (root-only copy).
[Unit]
Requires=hermes-env.service
After=hermes-env.service

[Service]
EnvironmentFile=/run/hermes-gateway.env
Environment=API_SERVER_ENABLED=true API_SERVER_HOST=127.0.0.1 API_SERVER_PORT=8642 SEARXNG_URL=http://127.0.0.1:8888
