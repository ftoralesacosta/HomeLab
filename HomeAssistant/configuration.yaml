
# Loads default set of integrations. Do not remove.
default_config:

# No per-integration `logs:` here on purpose. The UI debug toggle
# (Settings -> Devices & Services -> <integration> -> Enable debug logging)
# persists to .storage/core.logger and is applied at runtime, which silently
# overrides whatever `logs:` sets at startup - so pinning a level here looks
# like it works but stops as soon as that toggle is used. Enable debug on
# demand via the toggle, or with the logger.set_level action.
logger:
  default: warning

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12  # Docker bridge IP ranges
    - 192.168.4.0/24 #local network subnet
    - 172.23.0.11  # nginx-proxy-manager container (explicit, in case of CIDR-match regression after HA 2026.8.1 upgrade)

template:
  - fan:
      - name: "Virtual AC Fan"
        unique_id: virtual_ac_fan
        state: "{{ is_state('climate.living', 'fan_only') }}"
        percentage: >
          {% set mode = state_attr('climate.living', 'fan_mode') %}
          {% if mode == 'low' %} {{ (100/3) | round(2) }}
          {% elif mode == 'medium' %} {{ (200/3) | round(2) }}
          {% elif mode == 'high' %} 100
          {% else %} 0
          {% endif %}
        speed_count: 3
        turn_on:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.living
            data:
              hvac_mode: fan_only
        turn_off:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.living
            data:
              hvac_mode: "off"
        set_percentage:
          - action: script.turn_on
            target:
              entity_id: script.virtual_ac_fan_set_speed
            data:
              variables:
                percentage: "{{ percentage }}"

input_boolean:
  energy_saver:
    name: LG AC Energy Saver
    icon: mdi:leaf

