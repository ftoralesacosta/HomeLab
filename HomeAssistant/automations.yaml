- id: energy_saver_control_homekit
  alias: Energy Saver Control
  trigger:
  - platform: state
    entity_id: input_boolean.energy_saver
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.energy_saver
        state: 'on'
      sequence:
      - if:
        - condition: state
          entity_id: climate.living
          state: cool
        then:
        - action: climate.set_preset_mode
          target:
            entity_id: climate.living
          data:
            preset_mode: energy_saving
        else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.energy_saver
    - conditions:
      - condition: state
        entity_id: input_boolean.energy_saver
        state: 'off'
      sequence:
      - if:
        - condition: state
          entity_id: climate.living
          state: cool
        then:
        - action: climate.set_preset_mode
          target:
            entity_id: climate.living
          data:
            preset_mode: none
- id: energy_saver_sync_homekit
  alias: Energy Saver Sync
  trigger:
  - platform: state
    entity_id: climate.living
    attribute: preset_mode
  action:
  - if:
    - condition: template
      value_template: '{{ is_state_attr(''climate.living'', ''preset_mode'', ''energy_saving'')
        }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.energy_saver
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.energy_saver
